name: Requirements Intake Governance

on:
  pull_request:
    paths:
      - "Pflichtenheft.md"
      - "Lastenheft_Abarbeitungsreihenfolge.md"
      - "requirements/**"
      - "specs/intake-authoring-receipts/**"
      - "specs/requirements-reconciliation-20260726/**"
      - ".specify/intake-*.json"
      - ".specify/presets/intake-*/**"
      - ".specify/presets/.registry"
      - "scripts/*requirements-intake*"
      - "scripts/tests/requirements-intake-alignment-tests.mjs"
      - ".github/workflows/requirements-intake-governance.yml"
  push:
    branches:
      - main
      - "codex/**"
      - "claude/**"
      - "agy/**"
      - "gemini/**"
      - "copilot/**"
      - "opencode/**"
    paths:
      - "Pflichtenheft.md"
      - "Lastenheft_Abarbeitungsreihenfolge.md"
      - "requirements/**"
      - "specs/intake-authoring-receipts/**"
      - "specs/requirements-reconciliation-20260726/**"
      - ".specify/intake-*.json"
      - ".specify/presets/intake-*/**"
      - ".specify/presets/.registry"
      - "scripts/*requirements-intake*"
      - "scripts/tests/requirements-intake-alignment-tests.mjs"
      - ".github/workflows/requirements-intake-governance.yml"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - name: Validate requirements and intake alignment
        shell: pwsh
        run: ./scripts/validate-requirements-intake-alignment.ps1
      - name: Run negative fixtures
        shell: pwsh
        run: node scripts/tests/requirements-intake-alignment-tests.mjs
      - name: Validate installed lifecycle presets and immutable receipts in both shells
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $Repo = (Get-Location).Path
          $Before = (git status --porcelain --untracked-files=all) -join "`n"
          $Diff = (git diff HEAD --binary) -join "`n"
          $Reference = $null
          foreach ($Name in @('authoring','review','sequencing')) {
              $Prefix = ".specify/presets/intake-${Name}-governance/scripts/validate-intake-governance-config"
              $Bash = & bash "${Prefix}.sh" --config requirements/intake-governance-config.json --repo $Repo --json
              if ($LASTEXITCODE -ne 0) { throw "${Name}: Bash failed" }
              $Ps = & pwsh -NoProfile -File "${Prefix}.ps1" -Config requirements/intake-governance-config.json -Repo $Repo -Json
              if ($LASTEXITCODE -ne 0 -or $Bash -cne $Ps) { throw "${Name}: shell parity failed" }
              if ($null -ne $Reference -and $Reference -cne $Bash) { throw 'Preset JSON differs' }
              $Reference = $Bash
          }
          $Inventory = ($Reference | ConvertFrom-Json).inventory
          if ($Inventory.activeSeriesTargetCount -ne 0 -or $Inventory.seriesTargetCount -ne 10 -or $Inventory.eligibleCandidate -ne 'N/A') { throw 'Unexpected series lifecycle inventory' }
          $StandaloneActiveCount = [int]$Inventory.activeIntakeCount
          foreach ($Kind in @('manifest','receipt')) {
              $Prefix = ".specify/presets/intake-sequencing-governance/scripts/validate-intake-series-${Kind}"
              $File = "requirements/intakes/series/tui-vision-delivery/${Kind}.json"
              $Bash = & bash "${Prefix}.sh" --file $File --repo $Repo --json
              if ($LASTEXITCODE -ne 0) { throw "Series ${Kind}: Bash failed" }
              $Ps = & pwsh -NoProfile -File "${Prefix}.ps1" -File $File -Repo $Repo -Json
              if ($LASTEXITCODE -ne 0 -or $Bash -cne $Ps) { throw "Series ${Kind}: parity failed" }
              Write-Output $Bash
          }
          $Manifest = Get-Content requirements/intakes/series/tui-vision-delivery/manifest.json -Raw | ConvertFrom-Json
          if (@($Manifest.orderedTargets | Where-Object { $_.status -ne 'Completed' -or $_.path -notlike 'requirements/intakes/archive/*' }).Count) { throw 'Unexpected member location/status' }
          $Receipts = @(Get-ChildItem specs/intake-authoring-receipts -Filter *.json)
          # Abgeschlossene eigenstaendige Intakes behalten ihr Receipt nach der Archivierung.
          # Completed standalone intakes retain their receipt after archival.
          $ParsedReceipts = @($Receipts | ForEach-Object { Get-Content $_.FullName -Raw | ConvertFrom-Json })
          foreach ($Identity in @('receiptId', 'intakeId')) {
              $Values = @($ParsedReceipts | ForEach-Object { $_.$Identity })
              if (@($Values | Sort-Object -Unique).Count -ne $Values.Count) { throw "Duplicate ${Identity} in receipt inventory" }
          }
          $TargetPaths = @($ParsedReceipts | ForEach-Object { $_.target.path })
          if (@($TargetPaths | Sort-Object -Unique).Count -ne $TargetPaths.Count) { throw 'Duplicate target path in receipt inventory' }
          $StandaloneReceiptCount = @($ParsedReceipts | Where-Object { $_.series.seriesId -eq 'N/A' }).Count
          foreach ($Receipt in $Receipts) {
              $Prefix = '.specify/presets/intake-authoring-governance/scripts/validate-intake-authoring-receipt'
              $Bash = & bash "${Prefix}.sh" --receipt $Receipt.FullName --repo $Repo
              if ($LASTEXITCODE -ne 0) { throw "Bash receipt failed: $($Receipt.Name)" }
              $Ps = & pwsh -NoProfile -File "${Prefix}.ps1" -Receipt $Receipt.FullName -Repo $Repo
              if ($LASTEXITCODE -ne 0 -or $Bash -cne $Ps) { throw "Receipt parity failed: $($Receipt.Name)" }
          }
          if ($Before -cne ((git status --porcelain --untracked-files=all) -join "`n") -or $Diff -cne ((git diff HEAD --binary) -join "`n")) { throw 'Validator changed checkout' }
          Write-Output "PASS: three aligned presets; ten archived completed members; zero active/eligible series targets; ${StandaloneActiveCount} active standalone intakes; $($Receipts.Count) unique valid receipts including ${StandaloneReceiptCount} standalone receipts; both shells; unchanged checkout"
