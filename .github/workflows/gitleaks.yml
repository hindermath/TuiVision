name: Gitleaks

on:
  push:
  pull_request:

# DE: Nur lesender Checkout; unbenannte Token-Rechte bleiben gesperrt.
# EN: Read-only checkout; unspecified token permissions remain disabled.
permissions:
  contents: read

jobs:
  gitleaks:
    # DE/EN: Preserve existing PR review comments without repository content writes.
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
