name: Maintenance TUI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Maintenance TUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep the expensive cross-platform canary on the three public reference
        # repositories. Distributed/private fleet copies use Linux continuously.
        os: ${{ fromJSON(contains(fromJSON('["hindermath/home-baseline","hindermath/agent-operations-cockpit","hindermath/TuiVision"]'), github.repository) && '["ubuntu-22.04","macos-15","windows-2022"]' || '["ubuntu-22.04"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install required test tools (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install required test tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install ripgrep gitleaks
          test "$(gitleaks version)" = '8.30.1'

      - name: Install required test tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '15.2.0'
          $archive = "ripgrep-${version}-x86_64-pc-windows-msvc.zip"
          $release = "https://github.com/BurntSushi/ripgrep/releases/download/${version}"
          $archivePath = Join-Path $env:RUNNER_TEMP $archive
          $checksumPath = "${archivePath}.sha256"
          $extractRoot = Join-Path $env:RUNNER_TEMP 'ripgrep'
          Invoke-WebRequest -Uri "${release}/${archive}" -OutFile $archivePath
          Invoke-WebRequest -Uri "${release}/${archive}.sha256" -OutFile $checksumPath
          $expected = Get-Content -LiteralPath $checksumPath |
            Where-Object { $_ -match '^[0-9a-fA-F]{64}$' } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($expected)) {
              throw 'The published ripgrep checksum file contains no SHA-256 hash.'
          }
          $actual = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected.ToLowerInvariant()) {
              throw "ripgrep checksum mismatch: expected ${expected}, received ${actual}."
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractRoot -Force
          $binPath = Join-Path $extractRoot "ripgrep-${version}-x86_64-pc-windows-msvc"
          $binPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned gitleaks installation failed.' }
          (Join-Path (& go env GOPATH) 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore locked projects
        shell: pwsh
        run: |
          dotnet restore scripts/lib/maintenance-tui/src/HomeBaseline.MaintenanceTui/HomeBaseline.MaintenanceTui.csproj --locked-mode
          dotnet restore scripts/lib/maintenance-tui/tests/HomeBaseline.MaintenanceTui.Tests/HomeBaseline.MaintenanceTui.Tests.csproj --locked-mode

      - name: Build maintenance TUI
        shell: pwsh
        run: dotnet build scripts/lib/maintenance-tui/src/HomeBaseline.MaintenanceTui/HomeBaseline.MaintenanceTui.csproj --configuration Release --no-restore

      - name: Test maintenance TUI
        shell: pwsh
        run: dotnet test scripts/lib/maintenance-tui/tests/HomeBaseline.MaintenanceTui.Tests/HomeBaseline.MaintenanceTui.Tests.csproj --configuration Release --no-restore

      - name: test-maintenance-tui-wrappers (macOS and Ubuntu)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 -m unittest scripts.tests.test_maintenance_tui_wrappers -v

      - name: test-maintenance-tui-wrappers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m unittest scripts.tests.test_maintenance_tui_wrappers -v

      - name: Run full maintenance regressions (macOS and Ubuntu)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run Windows-native maintenance regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python -m unittest
          scripts.tests.test_maintenance_execution_context
          scripts.tests.test_maintenance_git_bundle
          scripts.tests.test_windows_maintenance_hardening

      - name: Validate Bash syntax
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n scripts/maintain-agentic-workspace.sh

      - name: Inventory packages
        shell: pwsh
        run: dotnet list scripts/lib/maintenance-tui/tests/HomeBaseline.MaintenanceTui.Tests/HomeBaseline.MaintenanceTui.Tests.csproj package --include-transitive

      - name: Audit vulnerable packages
        shell: pwsh
        run: dotnet list scripts/lib/maintenance-tui/tests/HomeBaseline.MaintenanceTui.Tests/HomeBaseline.MaintenanceTui.Tests.csproj package --vulnerable --include-transitive
