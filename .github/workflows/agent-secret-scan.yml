name: Agent Secret Scan

on:
  push:
  pull_request:

# DE: Nur lesender Checkout; unbenannte Token-Rechte bleiben gesperrt.
# EN: Read-only checkout; unspecified token permissions remain disabled.
permissions:
  contents: read

jobs:
  scan-agent-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Scan agent directories for secrets
        run: ./scripts/scan-agent-secrets.sh --fail-on-high .
