name: Project statistics proof

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statistics-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Statistics (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Preserve package bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Install pinned Spec Kit
        shell: pwsh
        run: |
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@464d57fe30c72e9a88d279cc49834539ec989c03
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify exact delivery head
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:EXPECTED_HEAD) { throw 'Delivery head mismatch.' }
          ./scripts/prove-project-statistics-context.ps1 -Repo . -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'statistics-proof')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: project-statistics-${{ matrix.os }}
          path: ${{ runner.temp }}/statistics-proof/
          if-no-files-found: error
