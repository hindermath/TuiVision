name: DocFX Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build DocFX site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_CHROMIUM_CHANNEL: chrome

    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/web-a11y/package-lock.json

      - name: Setup GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install DocFX
        shell: bash
        run: dotnet tool install --global docfx

      - name: Build DocFX site
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          docfx docfx.json

      - name: Install web accessibility dependencies
        working-directory: tests/web-a11y
        run: npm ci

      - name: Verify system Chrome
        run: google-chrome --version

      - name: Run DocFX accessibility smoke tests
        working-directory: tests/web-a11y
        run: npm test

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy DocFX site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
