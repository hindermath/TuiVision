  summary: >-
    Sortier-Hilfsklasse als managed Gegenstück zu <code>TNSSorter</code> / <code>TNSClass</code> aus Turbo Vision

    (<code>tnssorte.cc</code>). Das Original implementierte einen Heapsort oder Shellsort für

    TCollection-Unterklassen. Im .NET-Modell wird <code>Array.Sort</code> verwendet,

    das intern Intro-Sort (Heap + Quick + Insertion) ausführt.


    Sort helper class as managed counterpart to <code>TNSSorter</code> / <code>TNSClass</code> from Turbo Vision

    (<code>tnssorte.cc</code>). The original implemented a heap sort or shell sort for TCollection

    subclasses. In the .NET model, <code>Array.Sort</code> is used, which internally performs

    intro-sort (heap + quick + insertion).
