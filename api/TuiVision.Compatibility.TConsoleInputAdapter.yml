  summary: >-
    Verwaltete Eingabe-Bruecke zwischen <xref href="System.ConsoleKeyInfo" data-throw-if-not-resolved="false"></xref> und dem Turbo-Vision-Ereignismodell.

    Die Klasse buendelt die xterm-kompatible Tastaturmenge, die in Phase 8 als Ersatz fuer

    historische Raw-Input-Treiber nachgewiesen wird.


    Managed input bridge between <xref href="System.ConsoleKeyInfo" data-throw-if-not-resolved="false"></xref> and the Turbo Vision event model.

    The class bundles the xterm-compatible key subset that Phase 8 uses as proof replacement

    for the historical raw-input drivers.
