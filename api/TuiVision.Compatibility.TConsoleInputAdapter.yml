  assemblies:
  - TuiVision.Compatibility
  namespace: TuiVision.Compatibility
  summary: >-
    Prueft, ob eine Taste zur xterm-kompatiblen Navigations-/Funktionstastenmenge gehoert,

    die vom verwalteten Uebersetzer explizit nachgebildet wird.


    Checks whether a key belongs to the xterm-compatible navigation/function-key subset

    that is explicitly reproduced by the managed translator.
  example: []
  syntax:
    content: public static bool IsXtermCompatibleKey(ConsoleKey key)
    parameters:
    - id: key
      type: System.ConsoleKey
      description: Die zu pruefende Taste. / The key to examine.
    return:
      type: System.Boolean
      description: >-
        <code>true</code>, wenn die Taste im explizit unterstuetzten xterm-kompatiblen Satz liegt;

        andernfalls <code>false</code>.

        <code>true</code> if the key is part of the explicitly supported xterm-compatible subset;

        otherwise <code>false</code>.
    content.vb: Public Shared Function IsXtermCompatibleKey(key As ConsoleKey) As Boolean
