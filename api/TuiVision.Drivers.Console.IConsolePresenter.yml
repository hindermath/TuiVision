  summary: >-
    Empfängt einen gerenderten Frame von <xref href="TuiVision.Drivers.Console.TConsoleDriver" data-throw-if-not-resolved="false"></xref> und stellt ihn dar.

    Implementierungen können den Frame auf die echte Konsole, einen Test-Spy oder einen

    anderen Ausgabekanal schreiben.


    Receives a rendered frame from <xref href="TuiVision.Drivers.Console.TConsoleDriver" data-throw-if-not-resolved="false"></xref> and presents it.

    Implementations can write the frame to the real console, a test spy,

    or any other output channel.
