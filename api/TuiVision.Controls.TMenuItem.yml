  assemblies:
  - TuiVision.Controls
  namespace: TuiVision.Controls
  summary: >-
    Repräsentiert einen Menüpunkt in einer Menüleiste oder einem Menü.

    Kann verschachtelte Untermenüs enthalten. Trennzeilen werden mit dem

    speziellen Namen <code>"---"</code> oder über <xref href="TuiVision.Controls.TMenuItem.Separator(TuiVision.Controls.TMenuItem)" data-throw-if-not-resolved="false"></xref> erstellt.


    Represents a menu item in a menu bar or menu.

    Can contain nested submenus. Separator rows are created using the special

    name <code>"---"</code> or via <xref href="TuiVision.Controls.TMenuItem.Separator(TuiVision.Controls.TMenuItem)" data-throw-if-not-resolved="false"></xref>.
