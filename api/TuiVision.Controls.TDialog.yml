  assemblies:
  - TuiVision.Controls
  namespace: TuiVision.Controls
  summary: >-
    Validierungshook: Gibt <code>true</code> zurück, wenn der Dialog mit der angegebenen Befehl-ID

    geschlossen werden darf. Abgeleitete Klassen überschreiben diese Methode, um ungültige

    Zustände zu verhindern. Die Standardimplementierung erlaubt immer das Schließen.


    Validation hook: returns <code>true</code> when the dialog may be closed with the given command ID.

    Derived classes override this method to prevent invalid state closure.

    The default implementation always allows closing.
  example: []
  syntax:
    content: protected virtual bool Valid(ushort command)
    parameters:
    - id: command
      type: System.UInt16
      description: Die Befehl-ID, mit der der Dialog geschlossen werden soll. / The command ID used to close the dialog.
    return:
      type: System.Boolean
      description: >-
        <code>true</code>, wenn das Schließen erlaubt ist; <code>false</code>, um es zu verhindern.

        <code>true</code> to allow closing; <code>false</code> to prevent it.
    content.vb: Protected Overridable Function Valid(command As UShort) As Boolean
  overload: TuiVision.Controls.TDialog.Valid*
  nameWithType.vb: TDialog.Valid(UShort)
  fullName.vb: TuiVision.Controls.TDialog.Valid(UShort)
