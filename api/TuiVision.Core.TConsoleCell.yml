  namespace: TuiVision.Core
  summary: >-
    Die leere Standardzelle: Leerzeichen mit grauer Vordergrundfarbe auf schwarzem Hintergrund.

    Wird als Füllwert beim Leeren (<code>Clear()</code>) eines <xref href="TuiVision.Core.TConsoleBuffer" data-throw-if-not-resolved="false"></xref> verwendet.


    The default empty cell: a space character with gray foreground on black background.

    Used as the fill value when clearing (<code>Clear()</code>) a <xref href="TuiVision.Core.TConsoleBuffer" data-throw-if-not-resolved="false"></xref>.
