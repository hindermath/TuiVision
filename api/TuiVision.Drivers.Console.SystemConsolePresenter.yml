  summary: >-
    Stellt einen <xref href="TuiVision.Core.TConsoleBuffer" data-throw-if-not-resolved="false"></xref>-Frame auf der echten <xref href="System.Console" data-throw-if-not-resolved="false"></xref> dar.

    Alle Konsolen-API-Aufrufe sind von <code>try/catch</code>-Blöcken umgeben, damit der Presenter

    in Umgebungen ohne Terminal (z. B. CI, umgeleitete E/A, Smoke-Tests) stumm bleibt.


    Presents a <xref href="TuiVision.Core.TConsoleBuffer" data-throw-if-not-resolved="false"></xref> frame on the real <xref href="System.Console" data-throw-if-not-resolved="false"></xref>.

    All console API calls are wrapped in <code>try/catch</code> blocks so the presenter

    stays silent in environments without a terminal (e.g. CI, redirected I/O, smoke tests).
