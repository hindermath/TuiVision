    startLine: 24
  assemblies:
  - TuiVision.Controls
  namespace: TuiVision.Controls
  summary: >-
    Die Statuszeile am unteren Bildschirmrand.

    Zeigt kontextabhängige Hinweise und Shortcuts an.

    Wenn eine <xref href="TuiVision.Controls.TStatusDef" data-throw-if-not-resolved="false"></xref>-Kette konfiguriert ist, wird die erste passende

    Definition per First-Match-Wins ausgewählt; bei keiner Übereinstimmung bleibt die

    Zeile neutral (<xref href="TuiVision.Controls.TStatusLine.Items" data-throw-if-not-resolved="false"></xref> == <code>null</code>).

    Ohne <xref href="TuiVision.Controls.TStatusDef" data-throw-if-not-resolved="false"></xref> greift der Kompatibilitäts-Fallback auf

    <xref href="TuiVision.Controls.TView.GetStatusHints" data-throw-if-not-resolved="false"></xref> der fokussierten View zurück.


    The status line at the bottom of the screen.

    Displays context-sensitive hints and shortcuts.

    When a <xref href="TuiVision.Controls.TStatusDef" data-throw-if-not-resolved="false"></xref> chain is configured, the first matching definition

    is selected using first-match-wins ordering; when no definition matches, the line

    shows a neutral state (<xref href="TuiVision.Controls.TStatusLine.Items" data-throw-if-not-resolved="false"></xref> == <code>null</code>).

    Without a <xref href="TuiVision.Controls.TStatusDef" data-throw-if-not-resolved="false"></xref> the compatibility fallback uses

    <xref href="TuiVision.Controls.TView.GetStatusHints" data-throw-if-not-resolved="false"></xref> from the focused view.
  example: []
  syntax:
    content: 'public class TStatusLine : TView'
    content.vb: Public Class TStatusLine Inherits TView
