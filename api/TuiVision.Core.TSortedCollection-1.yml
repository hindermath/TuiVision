  summary: >-
    Sortierte generische Sammlung als managed Gegenstück zu <code>TSortedCollection</code>

    aus Turbo Vision (<code>tsortedc.cc</code>). Elemente werden beim Hinzufügen automatisch

    in aufsteigender Reihenfolge eingefügt. Duplikate werden erlaubt; für Eindeutigkeit

    verwende <code>TStringCollection</code> oder <xref href="System.Collections.Generic.SortedSet%601" data-throw-if-not-resolved="false"></xref>.


    Sorted generic collection as managed counterpart to <code>TSortedCollection</code> from Turbo Vision

    (<code>tsortedc.cc</code>). Elements are automatically inserted in ascending order when added.

    Duplicates are allowed; for uniqueness use <code>TStringCollection</code> or

    <xref href="System.Collections.Generic.SortedSet%601" data-throw-if-not-resolved="false"></xref>.
