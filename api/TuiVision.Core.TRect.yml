  summary: >-
    Rechteckiger Bereich, beschrieben durch eine inklusive obere linke Ecke (<xref href="TuiVision.Core.TRect.A" data-throw-if-not-resolved="false"></xref>)

    und eine exklusive untere rechte Ecke (<xref href="TuiVision.Core.TRect.B" data-throw-if-not-resolved="false"></xref>).

    Dieses Koordinatensystem entspricht dem Original von Turbo Vision.


    Rectangular region described by an inclusive top-left corner (<xref href="TuiVision.Core.TRect.A" data-throw-if-not-resolved="false"></xref>)

    and an exclusive bottom-right corner (<xref href="TuiVision.Core.TRect.B" data-throw-if-not-resolved="false"></xref>).

    This coordinate system matches the original Turbo Vision convention.
