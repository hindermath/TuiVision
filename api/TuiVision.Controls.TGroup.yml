  summary: >-
    Container-Ansicht, die Kind-Views in einer zirkulären doppelt-verlinkten Liste verwaltet.

    <xref href="TuiVision.Controls.TGroup" data-throw-if-not-resolved="false"></xref> implementiert Einfügen/Entfernen, Drei-Phasen-Ereignis-Dispatching,

    Fokus-Management, Zeichenpuffer-Lifecycle und State-Propagation.

    Portiert von <code>TGroup</code> aus Turbo Vision 2.0.3.


    Container view that manages child views in a circular singly-linked list.

    <xref href="TuiVision.Controls.TGroup" data-throw-if-not-resolved="false"></xref> implements insertion/removal, three-phase event dispatching,

    focus management, draw-buffer lifecycle, and state propagation.

    Ported from <code>TGroup</code> in Turbo Vision 2.0.3.
