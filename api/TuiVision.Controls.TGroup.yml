    Processes an event in three phases: PreProcess → Focused → PostProcess.


    <ol><li>PreProcess: child views with <xref href="TuiVision.Controls.TViewOptions.PreProcess" data-throw-if-not-resolved="false"></xref> flag receive the event.</li><li>Focused: the event is forwarded to <xref href="TuiVision.Controls.TGroup.Current" data-throw-if-not-resolved="false"></xref> (keyboard).</li><li>PostProcess: child views with <xref href="TuiVision.Controls.TViewOptions.PostProcess" data-throw-if-not-resolved="false"></xref> flag receive the event if not yet consumed.</li></ol>
