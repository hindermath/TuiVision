    id: Insert
    path: src/TuiVision.Controls/TGroup.cs
    startLine: 159
  assemblies:
  - TuiVision.Controls
  namespace: TuiVision.Controls
  summary: >-
    Fügt <code class="paramref">view</code> am Ende der Kind-Liste ein und setzt ihren

    <xref href="TuiVision.Controls.TView.Owner" data-throw-if-not-resolved="false"></xref> auf diese Gruppe.


    <p>

    <b>Algorithmus</b>: Die Kind-Liste ist eine zirkuläre Einfach-Liste.

    Jedes neue Element wird nach <code>_last</code> eingefügt und wird das neue <code>_last</code>.

    <code>First() = _last.Next</code> zeigt immer auf das erste (älteste) Element.

    </p>


    Inserts <code class="paramref">view</code> at the end of the child list and sets its

    <xref href="TuiVision.Controls.TView.Owner" data-throw-if-not-resolved="false"></xref> to this group.


    <p>

    <b>Algorithm</b>: The child list is a circular singly-linked list.

    Each new element is inserted after <code>_last</code> and becomes the new <code>_last</code>.

    <code>First() = _last.Next</code> always points to the first (oldest) element.

    </p>
  example: []
  syntax:
    content: public void Insert(TView view)
    parameters:
    - id: view
      type: TuiVision.Controls.TView
      description: >-
        Die einzufügende Kind-View. Darf nicht <code>null</code> sein, darf nicht bereits einer

        anderen Gruppe angehören und darf nicht die Gruppe selbst sein.


        The child view to insert. Must not be <code>null</code>, must not already belong to

        another group, and must not be the group itself.
    content.vb: Public Sub Insert(view As TView)
  overload: TuiVision.Controls.TGroup.Insert*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: >-
      Wird ausgelöst, wenn <code class="paramref">view</code> <code>null</code> ist.

      Thrown when <code class="paramref">view</code> is <code>null</code>.
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: >-
      Wird ausgelöst, wenn <code class="paramref">view</code> bereits einen Eigentümer hat

      oder wenn <code class="paramref">view</code> die Gruppe selbst ist.


      Thrown when <code class="paramref">view</code> already has an owner,

      or when <code class="paramref">view</code> is the group itself.
