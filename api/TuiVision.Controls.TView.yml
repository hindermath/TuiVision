  assemblies:
  - TuiVision.Controls
  namespace: TuiVision.Controls
  summary: >-
    Erstellt eine neue Ansicht mit dem angegebenen Begrenzungsrahmen.

    Der anfängliche Zustand ist <xref href="TuiVision.Controls.TViewState.Visible" data-throw-if-not-resolved="false"></xref>;

    die Ereignismaske reagiert auf Mausklicks, Tastenanschläge und Befehle.


    Creates a new view with the specified bounding rectangle.

    The initial state is <xref href="TuiVision.Controls.TViewState.Visible" data-throw-if-not-resolved="false"></xref>;

    the event mask responds to mouse clicks, key presses, and commands.
  example: []
  syntax:
    content: public TView(TRect bounds)
    parameters:
    - id: bounds
      type: TuiVision.Core.TRect
      description: >-
        Der anfängliche Begrenzungsrahmen in den Koordinaten des Eigentümers.

        Breite und Höhe dürfen nicht negativ sein.


        The initial bounding rectangle in the owner's coordinate space.

        Width and height must not be negative.
    content.vb: Public Sub New(bounds As TRect)
  overload: TuiVision.Controls.TView.#ctor*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: >-
      Wird ausgelöst, wenn die Breite oder Höhe von <code class="paramref">bounds</code> negativ ist.

      Thrown when the width or height of <code class="paramref">bounds</code> is negative.
