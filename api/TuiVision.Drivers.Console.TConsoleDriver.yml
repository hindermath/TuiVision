  summary: >-
    Übergibt einen unveränderlichen Schnappschuss des Hinterpuffers an den Presenter.

    Der Presenter erhält eine Kopie, damit er das Original nicht versehentlich verändern kann.


    Passes an immutable snapshot of the back buffer to the presenter.

    The presenter receives a copy so it cannot accidentally modify the original.
  example: []
  syntax:
    content: public void Present(IConsolePresenter presenter)
    parameters:
    - id: presenter
      type: TuiVision.Drivers.Console.IConsolePresenter
      description: >-
        Der Presenter, der den Frame darstellt. Darf nicht <code>null</code> sein.

        The presenter that renders the frame. Must not be <code>null</code>.
    content.vb: Public Sub Present(presenter As IConsolePresenter)
  overload: TuiVision.Drivers.Console.TConsoleDriver.Present*
  exceptions:
