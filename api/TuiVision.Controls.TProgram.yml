  assemblies:
  - TuiVision.Controls
  namespace: TuiVision.Controls
  summary: >-
    Ruft das nächste Tastatureingabe-Ereignis ab. Blockiert bis zu einem Tastendruck.

    Folgende Tastenkombinationen lösen <code>cmQuit</code> aus:


    <ul><li>Ctrl+Q — zuverlässig in macOS Terminal.app und anderen Terminals</li><li>Ctrl+C — erfordert zuvor gesetztes <code>TreatControlCAsInput = true</code></li><li>Alt+X / Alt+Q — wenn das Terminal die Meta-Taste als ESC-Sequenz überträgt</li></ul>


    In Umgebungen ohne Konsole (z. B. umgeleitete E/A) wird <xref href="TuiVision.Core.TEventKind.Nothing" data-throw-if-not-resolved="false"></xref> zurückgegeben.


    Retrieves the next keyboard event. Blocks until a key is pressed.

    The following key combinations trigger <code>cmQuit</code>:


    <ul><li>Ctrl+Q — reliable in macOS Terminal.app and other terminals</li><li>Ctrl+C — requires <code>TreatControlCAsInput = true</code> set beforehand</li><li>Alt+X / Alt+Q — when the terminal transmits the Meta key as an ESC sequence</li></ul>


    In environments without a console (e.g. redirected I/O) returns <xref href="TuiVision.Core.TEventKind.Nothing" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public virtual void GetEvent(out TEvent @event)
    parameters:
    - id: event
      type: TuiVision.Core.TEvent
      description: Das abgerufene Ereignis. / The retrieved event.
    content.vb: Public Overridable Sub GetEvent([event] As TEvent)
