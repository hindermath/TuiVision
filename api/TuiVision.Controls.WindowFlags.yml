  summary: >-
    Steuert sichtbare Fensterfähigkeiten: Schließen und Verschieben.

    Nur <xref href="TuiVision.Controls.WindowFlags.Close" data-throw-if-not-resolved="false"></xref> und <xref href="TuiVision.Controls.WindowFlags.Move" data-throw-if-not-resolved="false"></xref> sind für diese Revision definiert;

    Zoom und Grow liegen außerhalb des aktuellen Geltungsbereichs.


    Controls visible window capabilities: closing and moving.

    Only <xref href="TuiVision.Controls.WindowFlags.Close" data-throw-if-not-resolved="false"></xref> and <xref href="TuiVision.Controls.WindowFlags.Move" data-throw-if-not-resolved="false"></xref> are defined for this revision;

    zoom and grow are out of scope.
