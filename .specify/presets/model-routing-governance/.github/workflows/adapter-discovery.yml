name: Adapter discovery
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapters:
    name: Adapter contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check runtimes
        shell: pwsh
        run: |
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ([int](node -p 'process.versions.node.split(".")[0]') -lt 22) { throw 'Node.js 22+ required' }
      - name: .NET 10 for model-free execution regression
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        # A shared hosted installation can select a preinstalled newer SDK.
        # Isolate this regression's SDK so child processes also resolve .NET 10.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/model-routing-dotnet-10
        with:
          dotnet-version: '10.0.x'
      - name: Strict package PowerShell analysis (consumer settings)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -EQ '1.25.0')) {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery
          }
          $settings = (Resolve-Path .github/PSScriptAnalyzerSettings.psd1).Path
          $findings = @(Get-ChildItem scripts,tests -Recurse -File -Include '*.ps1','*.psm1' | ForEach-Object {
            # Linux/CoreCLR cannot reuse a dynamic assembly for multiple modules.
            # Isolate each file; preserve every rule, finding and analysis failure.
            Write-Host "Analyze: $($_.FullName)"
            $job = Start-Job -ScriptBlock {
              param($FilePath, $SettingsPath)
              $ErrorActionPreference = 'Stop'
              Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
              Invoke-ScriptAnalyzer -Path $FilePath -Settings $SettingsPath
            } -ArgumentList $_.FullName, $settings
            try {
              $null = Wait-Job $job
              Receive-Job $job -ErrorAction Stop
              if ($job.State -ne 'Completed') { throw 'Isolated script analysis failed' }
            } finally {
              Remove-Job $job -Force
            }
          })
          $findings | Format-Table ScriptName,Line,RuleName,Message -Wrap
          if ($findings.Count) { throw 'Package must pass strict consumer analysis before publication' }
      - name: Native Bash wrapper (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash tests/test-model-routing-discovery.sh
      - name: Adapter and unchanged legacy contracts (offline)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/test-additive-adapters.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/test-harness-result-transport.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/test-broad-model-selection.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/test-live-smoke-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/test-execution-policy.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/test-paired-validation.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/test-validation-hardening.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/test-live-smoke-dotnet.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/test-sdk-bridge.mjs tests/test-adapter-transports.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/test-release-status.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@(git status --porcelain --untracked-files=all).Count) { throw 'Adapter tests changed checkout' }
