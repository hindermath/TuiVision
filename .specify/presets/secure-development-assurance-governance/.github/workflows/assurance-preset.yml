name: Assurance Preset Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance:
    name: Assurance contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Rebound metadata cases add native process startup on Windows; keep all
    # assertions and allow the measured >15 minute regression to finish.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-14-arm64 is no longer provisioned by GitHub; keep the native
        # macOS contract gate on the supported standard runner instead.
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install pinned Spec Kit for generation regression
        shell: pwsh
        run: |
          python -m pip install 'git+https://github.com/github/spec-kit.git@e802a7dd52a6eceba9403cbbf40e60dced043238'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          specify version
      - name: Validate contracts and generated commands
        shell: pwsh
        run: |
          foreach ($command in @('git', 'bash', 'pwsh', 'jq', 'specify')) {
            Get-Command $command -ErrorAction Stop | Select-Object Name, Source
          }
          pwsh -NoProfile -File tests/test-secure-development-assurance.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/test-installed-surfaces.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
