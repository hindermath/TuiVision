name: Assurance Preset Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance:
    name: Assurance contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - name: Install pinned Spec Kit for generation regression
        shell: pwsh
        run: |
          python -m pip install 'git+https://github.com/github/spec-kit.git@e802a7dd52a6eceba9403cbbf40e60dced043238'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          specify version
      - name: Validate contracts and generated commands
        shell: pwsh
        run: |
          foreach ($command in @('git', 'bash', 'pwsh', 'jq', 'specify')) {
            Get-Command $command -ErrorAction Stop | Select-Object Name, Source
          }
          pwsh -NoProfile -File tests/test-secure-development-assurance.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/test-installed-surfaces.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
