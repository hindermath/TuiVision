schema_version: "1.0"

preset:
  id: "intake-sequencing-governance"
  name: "Intake Sequencing Governance"
  version: "0.1.1"
  description: "Manages traceable intake-series order, typed dependencies, lifecycle, and next-candidate selection without executing downstream workflows."
  author: "Thorsten Hindermann"
  repository: "https://github.com/hindermath/spec-kit-preset-intake-sequencing-governance"
  license: "MIT"

requires:
  speckit_version: ">=0.8.3"

provides:
  templates:
    - {type: "template", name: "intake-series-policy-template", file: "templates/intake-series-policy-template.json", description: "Project policy for series paths, edge types, lifecycle, and authority"}
    - {type: "template", name: "intake-series-manifest-template", file: "templates/intake-series-manifest-template.json", description: "Ordered targets, roots, typed dependencies, and lifecycle"}
    - {type: "template", name: "intake-series-receipt-template", file: "templates/intake-series-receipt-template.json", description: "Manifest hash, operation authority, lineage, and validation outcome"}
    - {type: "template", name: "intake-series-operation-template", file: "templates/intake-series-operation-template.json", description: "Transactional multi-file operation journal"}
    - {type: "template", name: "intake-series-tombstone-template", file: "templates/intake-series-tombstone-template.json", description: "Logical deletion and archive proof"}
    - {type: "template", name: "intake-series-order-template", file: "templates/intake-series-order-template.md", description: "Learner-readable order and dependency document"}
    - {type: "template", name: "intake-series-checklist-template", file: "templates/intake-series-checklist-template.md", description: "Series readiness and lifecycle checklist"}
    - {type: "template", name: "intake-series-runbook-template", file: "templates/intake-series-runbook-template.md", description: "Portable CRUD, status, and next-candidate runbook"}
    - {type: "template", name: "intake-series-agent-guidance-addendum", file: "templates/agent-file-addendum.md", description: "Agent-neutral sequencing and authority guidance"}
    - {type: "template", name: "intake-series-field-validation-summary", file: "templates/field-validation-summary.md", description: "Synthetic, field, composition, and release evidence"}
    - {type: "command", name: "speckit.intake-series-create", file: "commands/speckit.intake-series-create.md", description: "Create one new series from explicitly named existing intakes"}
    - {type: "command", name: "speckit.intake-series-read", file: "commands/speckit.intake-series-read.md", description: "Summarize a series read-only"}
    - {type: "command", name: "speckit.intake-series-update", file: "commands/speckit.intake-series-update.md", description: "Update one series with explicit authority and supersession evidence"}
    - {type: "command", name: "speckit.intake-series-delete", file: "commands/speckit.intake-series-delete.md", description: "Logically delete one series through archive and tombstone evidence"}
    - {type: "command", name: "speckit.intake-series-status", file: "commands/speckit.intake-series-status.md", description: "Validate current series state without writes"}
    - {type: "command", name: "speckit.intake-series-next", file: "commands/speckit.intake-series-next.md", description: "List eligible targets or exact blockers without starting them"}

tags:
  - "intake"
  - "sequencing"
  - "governance"
  - "dag"
  - "lifecycle"
  - "spec-kit"
  - "autonomous"
