schema_version: "1.0"
preset:
  id: "project-statistics-governance"
  name: "Project Statistics Governance"
  version: "0.1.0"
  description: "Reproducible Git-bound project transparency with offline measurements, explicit write authority and opt-in reference estimates; no AI productivity claims."
  author: "Thorsten Hindermann"
  repository: "https://github.com/hindermath/spec-kit-preset-project-statistics-governance"
  license: "MIT"
requires:
  speckit_version: ">=0.12.8"
provides:
  templates:
    - type: "template"
      name: "project-statistics-contract"
      file: "templates/project-statistics-contract.md"
      description: "Portable measurement, provenance and authority contract"
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-addendum.md"
      strategy: "append"
      description: "Append reproducible project transparency governance"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-addendum.md"
      strategy: "append"
      description: "Plan reproducibility and explicit update authority"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-addendum.md"
      strategy: "append"
      description: "Serialize statistics updates and verify evidence"
    - type: "command"
      name: "speckit.statistics-init"
      file: "commands/speckit.statistics-init.md"
      description: "Initialize a separate statistics context with explicit permission"
    - type: "command"
      name: "speckit.statistics-status"
      file: "commands/speckit.statistics-status.md"
      description: "Inspect reproducibility and freshness without changes"
    - type: "command"
      name: "speckit.statistics-update"
      file: "commands/speckit.statistics-update.md"
      description: "Preview and explicitly update a statistics report"
tags:
  - "project-statistics"
  - "reproducibility"
  - "governance"
  - "accessibility"
