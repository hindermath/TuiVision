name: Lifecycle validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Shipped JSON template integrity
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/test-template-integrity.ps1
      - name: Configuration parity and zero writes
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./tests/test-intake-governance-config.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Domain regression
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./tests/test-intake-authoring-validator.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File ./tests/test-intake-authoring-lifecycle.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tracked checkout remains unchanged
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git status --porcelain --untracked-files=all) { throw 'Validation wrote repository files' }
